# Livraison continue : construit et publie l'image Docker sur GitHub Container Registry.
#  - tag vX.Y.Z (fin d'une branche release GitFlow) -> ghcr.io/<owner>/livraison-express:X.Y.Z, X.Y, latest
#  - push sur develop -> ghcr.io/<owner>/livraison-express:develop (version de développement)
# Authentification avec le GITHUB_TOKEN du workflow : aucun Personal Access Token à stocker.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build et publication sur ghcr.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image en minuscules
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY_OWNER,,}/livraison-express" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels (Semantic Versioning)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,format=short

      - name: Build (avec tests) puis push de l'image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
