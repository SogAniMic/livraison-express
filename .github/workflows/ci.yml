# Intégration continue : à chaque push sur une branche GitFlow et à chaque Pull Request.
# Checkout -> Python -> lint (ruff) -> tests (pytest, dont intégration MongoDB) -> build Docker
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint et tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        env:
          MONGO_URI: mongodb://localhost:27017
        run: pytest -q

  docker-build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Étape de test (lint + tests dans l'image)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image de production
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          load: true
          tags: livraison-express:ci
          cache-from: type=gha

      - name: Smoke test de l'image (non-root, /health)
        run: |
          test "$(docker run --rm --entrypoint id livraison-express:ci -u)" = "10001"
          docker run -d --name api -p 8000:8000 livraison-express:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/health/ready)" = "503"
          docker rm -f api
